server.port=8084
spring.application.name=jek-otel-java-springboot3x-soap

# CXF servlet path — combined with the @Bean Endpoint's publish address (/webmethods)
# this gives /ws/webmethods and /ws/webmethods?wsdl.
cxf.path=/ws

# Expose only the standard health endpoint for liveness probes; keep the surface small.
management.endpoints.web.exposure.include=health
