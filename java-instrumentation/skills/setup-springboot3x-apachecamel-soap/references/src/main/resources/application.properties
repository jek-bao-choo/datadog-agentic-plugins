server.port=8083
spring.application.name=jek-otel-java-springboot3x-apachecamel-soap

# Keep the JVM alive even when there are no incoming requests (Camel best practice).
camel.springboot.main-run-controller=true

# Trim actuator surface to just /actuator/health for liveness probes.
management.endpoints.web.exposure.include=health

# Downstream SOAP endpoint (App B from setup-springboot3x-soap on the same host).
# Use the literal IPv4 loopback — `localhost` triggers IPv6 dual-stack resolution
# that intermittently fails under the OTel Java Agent's HTTP client interception.
webmethods.endpoint=http://127.0.0.1:8084/ws/webmethods
