# Recommended OpenTelemetry Collector configuration
# Setup: Uncontainerized Agent in a non-cloud environment
# Collector Contrib version: v0.150.1

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679
  file_storage:
    directory: /var/lib/otelcol-contrib/storage
  # Datadog extension — makes collector visible in Datadog Infrastructure and Fleet Automation
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/extension/datadogextension/README.md
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}
    hostname: ${env:CUSTOM_HOSTNAME}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Collect own metrics
  # prometheus:
  #   config:
  #     scrape_configs:
  #     - job_name: 'otel-collector'
  #       scrape_interval: 10s
  #       static_configs:
  #       - targets: ['0.0.0.0:8888']

  # Host metrics — replaces Datadog Agent for infrastructure monitoring
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      paging:
      processes:

  # System logs — collect syslog and auth logs from the host
  filelog/system:
    include:
      - /var/log/messages
      - /var/log/secure
    include_file_name: true
    include_file_path: true
    storage: file_storage
    operators:
      - type: regex_parser
        regex: '^(?P<time>\w+ +\d+ \d+:\d+:\d+) (?P<host>\S+) (?P<ident>\S+?)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'
        severity:
          parse_from: attributes.ident
        timestamp:
          parse_from: attributes.time
          layout: '%b %d %H:%M:%S'

processors:
  resourcedetection:
    detectors: [system, env]
    override: true # Disable if incoming attributes (especially host.name) are verified correct
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.name:
          enabled: true
        host.arch:
          enabled: true
        host.cpu.cache.l2.size:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        os.description:
          enabled: true
        os.type:
          enabled: true

  # Convert cumulative metrics to delta (only needed for OTLP HTTP exporter option)
  cumulativetodelta:

exporters:
  # =========================================================================
  # ACTIVE: Native Datadog exporter (full-fidelity service map, trace metrics)
  # =========================================================================
  datadog/exporter:
    hostname: ${env:CUSTOM_HOSTNAME}
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}
    traces:
      span_name_as_resource_name: true
    host_metadata:
      enabled: true
      hostname_source: config_or_system
      tags:
        - env:sandbox
        - owner:jek

  # =========================================================================
  # COMMENTED OUT: OTLP HTTP exporters (restore by uncommenting below
  # and switching pipeline exporters to otlphttp/dd_*)
  # =========================================================================
  otlp_http/dd_traces:
    traces_endpoint: "https://otlp.${env:DD_SITE}/v1/traces"
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otlp-source: "datadog"
    sending_queue:
      batch: {} # Default batch settings
  
  otlp_http/dd_metrics:
    metrics_endpoint: "https://otlp.${env:DD_SITE}/api/v2/otlpmetrics"
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-metric-config: >-
        {
        "resource_attributes_as_tags": true,
        "instrumentation_scope_metadata_as_tags": true
        }
    compression: zstd
    compression_params:
      level: 3 # Level must be set explicitly for zstd
    sending_queue:
      batch: {} # Default batch settings
  
  otlp_http/dd_logs:
    logs_endpoint: "https://otlp.${env:DD_SITE}/v1/logs"
    headers:
      dd-api-key: ${env:DD_API_KEY}
    sending_queue:
      batch: {} # Default batch settings

  # Debug exporter — for troubleshooting during setup
  debug:
    verbosity: detailed

# Datadog Connector — computes APM stats (latency, error rates, request counts) from traces.
# Powers service map edge metrics, APM service page, and latency histograms.
# https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/datadogconnector

connectors:
  datadog/connector:
    traces:
      span_name_as_resource_name: true
      compute_stats_by_span_kind: true
      peer_tags_aggregation: true

service:
  # Self-monitoring is not recommended, but currently the simplest way to perform enriching
  telemetry:
    metrics:
      readers:
        # - pull:
        #     exporter:
        #       prometheus:
        #         host: '127.0.0.1'
        #         port: 8888
        #         without_scope_info: true
        #         without_type_suffix: true
        #         without_units: true
        #         with_resource_constant_labels:
        #           included: [ ]
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318

  pipelines:
    # Traces flow: otlp → resourcedetection → datadog/connector → datadog/exporter
    # The connector computes APM stats before traces are exported.
    traces:
      receivers: [otlp]
      processors: [resourcedetection]
      exporters: [datadog/connector]
    traces/2:
      receivers: [datadog/connector]
      # exporters: [datadog/exporter, debug]
      exporters: [otlp_http/dd_traces, debug]
    metrics:
      # receivers: [otlp, prometheus, hostmetrics, datadog/connector]
      receivers: [otlp, hostmetrics, datadog/connector]
      # processors: [resourcedetection]
      # exporters: [datadog/exporter]
      processors: [resourcedetection, cumulativetodelta]
      exporters: [otlp_http/dd_metrics]
    logs:
      receivers: [otlp, filelog/system]
      processors: [resourcedetection]
      # exporters: [datadog/exporter]
      exporters: [otlp_http/dd_logs]
  
  extensions: [health_check, pprof, zpages, file_storage, datadog]
