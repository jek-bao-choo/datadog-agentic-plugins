receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics — replaces Datadog Agent for infrastructure monitoring
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      paging:
      processes:

  # System logs — collect syslog and auth logs from the host
  filelog/system:
    include:
      - /var/log/messages
      - /var/log/secure
    include_file_name: true
    include_file_path: true
    storage: file_storage
    operators:
      - type: regex_parser
        regex: '^(?P<time>\w+ +\d+ \d+:\d+:\d+) (?P<host>\S+) (?P<ident>\S+?)(?:\[(?P<pid>\d+)\])?: (?P<message>.*)$'
        severity:
          parse_from: attributes.ident
        timestamp:
          parse_from: attributes.time
          layout: '%b %d %H:%M:%S'

processors:
  resourcedetection:
    detectors: [system, env]
    system:
      hostname_sources: ["os"]
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true

  # Convert cumulative metrics to delta (only needed for OTLP HTTP exporter option)
  cumulativetodelta:

exporters:
  # =========================================================================
  # ACTIVE: Native Datadog exporter (full-fidelity service map, trace metrics)
  # =========================================================================
  datadog/exporter:
    hostname: "jek-ec2-centos9"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    api:
      key: ${env:DD_API_KEY}
      site: datadoghq.com
    traces:
      span_name_as_resource_name: true
    host_metadata:
      enabled: true
      hostname_source: config_or_system
      tags:
        - env:sandbox
        - owner:jek

  # =========================================================================
  # COMMENTED OUT: OTLP HTTP exporters (restore by uncommenting below
  # and switching pipeline exporters to otlphttp/dd_*)
  # =========================================================================
  # otlphttp/dd_traces:
  #   traces_endpoint: "https://otlp.datadoghq.com/v1/traces"
  #   headers:
  #     dd-api-key: ${env:DD_API_KEY}
  #     dd-otlp-source: "datadog"
  #
  # otlphttp/dd_metrics:
  #   metrics_endpoint: "https://otlp.datadoghq.com/v1/metrics"
  #   headers:
  #     dd-api-key: ${env:DD_API_KEY}
  #     dd-otel-metric-config: '{"resource_attributes_as_tags": true}'
  #
  # otlphttp/dd_logs:
  #   logs_endpoint: "https://otlp.datadoghq.com/v1/logs"
  #   headers:
  #     dd-api-key: ${env:DD_API_KEY}

  # Debug exporter — for troubleshooting during setup
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol-contrib/storage
  # Datadog extension — makes collector visible in Datadog Infrastructure and Fleet Automation
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/extension/datadogextension/README.md
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: datadoghq.com
    hostname: "jek-ec2-centos9"

service:
  extensions: [health_check, file_storage, datadog]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection]
      exporters: [datadog/exporter, debug]
      # exporters: [otlphttp/dd_traces, debug]  # OTLP HTTP option
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [resourcedetection]
      exporters: [datadog/exporter]
      # processors: [resourcedetection, cumulativetodelta]  # OTLP HTTP option
      # exporters: [otlphttp/dd_metrics]                    # OTLP HTTP option
    logs:
      receivers: [otlp, filelog/system]
      processors: [resourcedetection]
      exporters: [datadog/exporter]
      # exporters: [otlphttp/dd_logs]  # OTLP HTTP option
