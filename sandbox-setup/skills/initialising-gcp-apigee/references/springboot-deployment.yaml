apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-backend
  template:
    metadata:
      labels:
        app: springboot-backend
    spec:
      serviceAccountName: springboot-sa
      containers:
        - name: springboot
          # Placeholder: use nginx to verify end-to-end connectivity
          # Replace with your actual Spring Boot image when ready
          image: nginx:latest
          ports:
            - containerPort: 80